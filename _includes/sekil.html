<svg class="sekil" viewBox="0 0 200 200" aria-hidden="true">
  <defs>
    <radialGradient id="hale-{{ include.slug }}"><stop offset="0" stop-color="#ff7a2a" stop-opacity="0.55"/><stop offset="1" stop-color="#ff7a2a" stop-opacity="0"/></radialGradient>
    <radialGradient id="isik-{{ include.slug }}"><stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.3" stop-color="#ffe2a8" stop-opacity="0.35"/><stop offset="1" stop-color="#ffe2a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="kure-{{ include.slug }}" cx="0.4" cy="0.32" r="0.75"><stop offset="0" stop-color="#fff6d8"/><stop offset="0.25" stop-color="#ffc04d"/><stop offset="0.65" stop-color="#ff5a1f"/><stop offset="1" stop-color="#7a1300"/></radialGradient>
    <filter id="parla-{{ include.slug }}" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  {% if include.slug == "nokta" %}
  <circle cx="100" cy="100" r="40" fill="url(#isik-{{ include.slug }})"/>
  <circle cx="100" cy="100" r="5" fill="#ffffff"/>
  {% elsif include.slug == "cember" %}
  <circle cx="100" cy="100" r="62" fill="none" stroke="#ffe2a8" stroke-width="3" filter="url(#parla-{{ include.slug }})"/>
  {% else %}
  <circle cx="100" cy="100" r="96" fill="url(#hale-{{ include.slug }})"/>
  <circle cx="100" cy="100" r="62" fill="url(#kure-{{ include.slug }})"/>
  {% endif %}
</svg>
