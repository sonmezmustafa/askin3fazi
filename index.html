---
<h1 class="kapak"><img src="{{ '/assets/kapak.jpg' | relative_url }}" width="1080" height="1680" alt="{{ site.title }}"></h1>
{% for faz in site.data.fazlar %}
{% assign siirler = site.siirler | where: "faz", faz.numara | sort: "sira" %}
<section class="faz">
  <h2>{{ faz.ad }}</h2>
  {% if siirler.size > 0 %}
  <ol>
    {% for s in siirler %}<li><a href="{{ s.url | relative_url }}">{{ s.baslik }}</a></li>
    {% endfor %}
  </ol>
  {% endif %}
</section>
{% endfor %}
