<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.baslik %}{{ page.baslik }} · {% endif %}{{ site.title }}</title>
{% if site.taslak %}<meta name="robots" content="noindex, nofollow">{% endif %}
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:title" content="{% if page.baslik %}{{ page.baslik }} · {% endif %}{{ site.title }}">
<meta property="og:image" content="{{ '/assets/kapak.jpg' | absolute_url }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0b0b0b">
<link rel="stylesheet" href="{{ '/assets/stil.css' | relative_url }}">
</head>
<body class="tek">
<header class="ust"><a href="{{ '/' | relative_url }}{% if page.collection == 'siirler' %}#s-{{ page.slug }}{% endif %}">‹ {{ site.title }}</a></header>
<main class="kagit">
{{ content }}
</main>
<footer class="alt">
  <p>© {{ site.time | date: '%Y' }} askin3fazi.com · Tüm hakları alan adının sahibine kayıtlıdır.</p>
</footer>
</body>
</html>
